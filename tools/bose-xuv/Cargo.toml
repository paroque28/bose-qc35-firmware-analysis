[package]
name = "bose-xuv"
version = "0.1.0"
edition = "2021"
description = "Flash Bose .xuv external-flash images (SQIF) over USB HID, the path bose-dfu does not cover"
license = "MIT"

# Pinned to the same stable, long-published versions bose-dfu 1.1.0 uses, so nothing
# recent is pulled in. hidapi is built against the system backend on macOS.
[dependencies]
anyhow = "1.0"
clap = { version = "3.1", features = ["derive"] }
env_logger = "0.9"
log = "0.4"
hidapi = "1.3"

[profile.release]
lto = true
